<svg width="100%" viewBox="0 0 680 504" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cohort-with-QC pipeline</title>
<desc>15-stage pipeline for cohort mode, generated from the registered stages. Gray marks stages shared with the standards-only profile, coral marks stages with a cohort-specific implementation, teal marks stages the standards-only profile does not have.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { font-size: 12px; fill: #2c2c2a; }
  .lbl-strong { font-size: 12px; font-weight: 600; }
  .box   { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
  .coral { fill: #F0997B; stroke: #993C1D; stroke-width: 0.5; }
  .coral text { fill: #4A1B0C; }
  .teal  { fill: #5DCAA5; stroke: #0F6E56; stroke-width: 0.5; }
  .teal text { fill: #04342C; }
</style>

<g><rect class="box" x="40" y="60" width="186" height="36" rx="6"/><text class="lbl" x="133" y="78" text-anchor="middle" dominant-baseline="central">ingestion</text></g>
<g><rect class="box" x="246" y="60" width="186" height="36" rx="6"/><text class="lbl" x="339" y="78" text-anchor="middle" dominant-baseline="central">scan_summary_cache</text></g>
<g><rect class="box" x="452" y="60" width="186" height="36" rx="6"/><text class="lbl" x="545" y="78" text-anchor="middle" dominant-baseline="central">chromatogram_plotting</text></g>

<g><rect class="box" x="452" y="146" width="186" height="36" rx="6"/><text class="lbl" x="545" y="164" text-anchor="middle" dominant-baseline="central">feature_detection</text></g>
<g><rect class="teal" x="246" y="146" width="186" height="36" rx="6"/><text class="lbl-strong" x="339" y="164" text-anchor="middle" dominant-baseline="central">feature_alignment</text></g>
<g><rect class="coral" x="40" y="146" width="186" height="36" rx="6"/><text class="lbl-strong" x="133" y="164" text-anchor="middle" dominant-baseline="central">blank_qc</text></g>

<g><rect class="coral" x="40" y="232" width="186" height="36" rx="6"/><text class="lbl-strong" x="133" y="250" text-anchor="middle" dominant-baseline="central">adduct_annotation</text></g>
<g><rect class="coral" x="246" y="232" width="186" height="36" rx="6"/><text class="lbl-strong" x="339" y="250" text-anchor="middle" dominant-baseline="central">library_matching</text></g>
<g><rect class="coral" x="452" y="232" width="186" height="36" rx="6"/><text class="lbl-strong" x="545" y="250" text-anchor="middle" dominant-baseline="central">library_assembly</text></g>

<g><rect class="teal" x="452" y="318" width="186" height="36" rx="6"/><text class="lbl-strong" x="545" y="336" text-anchor="middle" dominant-baseline="central">summary_stats_plotting</text></g>
<g><rect class="teal" x="246" y="318" width="186" height="36" rx="6"/><text class="lbl-strong" x="339" y="336" text-anchor="middle" dominant-baseline="central">plsda</text></g>
<g><rect class="teal" x="40" y="318" width="186" height="36" rx="6"/><text class="lbl-strong" x="133" y="336" text-anchor="middle" dominant-baseline="central">heatmap_clustering</text></g>

<g><rect class="teal" x="40" y="404" width="186" height="36" rx="6"/><text class="lbl-strong" x="133" y="422" text-anchor="middle" dominant-baseline="central">volcano_plot</text></g>
<g><rect class="teal" x="246" y="404" width="186" height="36" rx="6"/><text class="lbl-strong" x="339" y="422" text-anchor="middle" dominant-baseline="central">xic_plotting</text></g>
<g><rect class="coral" x="452" y="404" width="186" height="36" rx="6"/><text class="lbl-strong" x="545" y="422" text-anchor="middle" dominant-baseline="central">export</text></g>

<line x1="226" y1="78" x2="246" y2="78" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow2)"/>
